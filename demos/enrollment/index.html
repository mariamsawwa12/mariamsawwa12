<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Educational Enrollment Dashboard</title>
<script src="chart.umd.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;color:#242424;background:#ececec}.app{height:100%;display:grid;grid-template-columns:236px 1fr;gap:10px;padding:3px}.side,.main{background:#fafafa;border:4px solid #bdbdbd;border-radius:18px;overflow:hidden}.side{padding:16px}.main{padding:7px 10px}.title{font-size:20px;font-weight:800;text-align:center;margin:1px 0 6px;line-height:1.08;white-space:nowrap}.label{font-size:17px;font-weight:800;margin:10px 0 7px}.checks label,.radios label{display:block;font-size:14px;font-weight:700;margin:7px 0}.checks input,.radios input{accent-color:#333}.year-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.year-row select,.select{width:100%;padding:7px;border:1px solid #ccc;background:#fff;font-size:13px;font-weight:700}.series-tiles{display:grid;grid-template-columns:1fr 1fr;gap:4px}.series-tiles button{min-height:70px;border:0;background:#333;color:#fff;padding:6px;font-size:10px;font-weight:800;cursor:pointer}.series-tiles button.active{outline:3px solid #999}.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{flex:1;border:0;background:#333;color:#fff;padding:9px 5px;font-weight:800;cursor:pointer}.tabs button.active{background:#2b76c8}.side-mode{display:none}.side-mode.active{display:block}.page{display:none}.page.active{display:block}
.panel{background:#e6eef7;box-shadow:0 5px 14px rgba(0,0,0,.28);padding:8px}.panel h3{margin:0 0 5px;text-align:center;font-size:13px;line-height:1.12}.overview-grid{height:calc(100vh - 34px);display:grid;grid-template-columns:1.22fr 1fr;grid-template-rows:61% 36%;gap:10px}.mapwrap,.barwrap{height:calc(100% - 39px)}.mapwrap{position:relative;background:url('map-bg.png') center/cover no-repeat;overflow:hidden}.bubble{position:absolute;border:2px solid #0b4ca8;border-radius:50%;background:rgba(45,142,232,.82);transform:translate(-50%,-50%);cursor:pointer}.bubble.dim{opacity:.2}.bubble.sel{box-shadow:0 0 0 4px rgba(0,0,0,.28)}.bottom{grid-column:1/3;display:grid;grid-template-columns:.78fr 1.35fr;gap:12px}.bottom h3{font-size:14px;margin:0 0 4px;line-height:1.15;white-space:nowrap}.kpi{height:calc(100% - 22px);min-height:80px;display:grid;place-items:center;border:6px solid #d1d1d1;border-radius:28px;background:#e6eef7;box-shadow:0 4px 10px #999;font-size:46px}.insights,.insights2{font-family:Georgia,serif;background:#e6eef7;border:2px solid #777;padding:12px;font-size:15px;line-height:1.5}.trend-grid{height:70vh;display:grid;grid-template-columns:1.45fr .8fr;gap:10px}.chartbox{height:calc(100% - 42px)}.insights2{margin-top:8px;height:calc(30vh - 36px);min-height:72px}.hint{font-size:10px;color:#666;margin-top:8px}.swatch{display:inline-block;width:10px;height:10px;margin-right:5px}

@media(max-width:700px){
 html,body{height:auto;min-height:100%;overflow-x:hidden}
 .app{height:auto;min-height:100vh;display:block;padding:4px}
 .side,.main{border-width:2px;border-radius:12px;overflow:visible}
 .side{padding:10px;margin-bottom:6px}
 .main{padding:7px}
 .title{font-size:14px;line-height:1.25;white-space:normal;margin:2px 4px 8px}
 .label{font-size:12px;margin:8px 0 5px}
 .checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
 .checks label,.radios label{font-size:11px;margin:4px 0}
 .year-row select,.select{font-size:11px;padding:6px}
 .series-tiles button{min-height:50px;font-size:9px;padding:5px}
 .tabs{margin-top:10px;gap:6px}.tabs button{padding:8px 4px;font-size:11px}
 .panel{padding:7px}.panel h3,.bottom h3{font-size:11px;white-space:normal}
 .overview-grid{height:auto;display:grid;grid-template-columns:1fr;grid-template-rows:auto;gap:8px}
 .overview-grid>.panel{min-height:270px}
 .mapwrap,.barwrap{height:225px}
 .bottom{grid-column:auto;display:grid;grid-template-columns:1fr;gap:8px}
 .kpi{height:auto;min-height:95px;border-width:4px;border-radius:20px;font-size:34px}
 .insights,.insights2{padding:9px;font-size:12px;line-height:1.4}
 .trend-grid{height:auto;display:grid;grid-template-columns:1fr;gap:8px}
 .trend-grid>.panel{min-height:290px}
 .chartbox{height:245px}
 .insights2{height:auto;min-height:0;margin-top:8px}
 .hint{font-size:9px}
}
</style></head><body><div class="app"><aside class="side"><div id="overviewSide" class="side-mode active"><div class="label">Country Name</div><div class="checks" id="countries"></div><div class="label">Years</div><div class="year-row"><select id="fromYear"></select><select id="toYear"></select></div><div class="label">Series</div><select class="select" id="seriesSelect"><option value="all">All</option><option value="primary">Enrolment in primary education</option><option value="secondary">Enrolment in secondary education</option><option value="tertiary">Enrolment in tertiary education</option><option value="multiple" disabled>Multiple indicators</option></select><div class="hint"></div></div>
<div id="detailSide" class="side-mode"><div class="label">Country Name</div><div class="radios" id="focusRadios"></div><div class="label">Years</div><div class="year-row"><select id="fromYear2"></select><select id="toYear2"></select></div><div class="label">Series</div><div class="series-tiles"><button id="allSeries" class="active">Select all</button><button class="seriesTile" data-series="secondary">Enrolment in secondary education</button><button class="seriesTile" data-series="primary">Enrolment in primary education</button><button class="seriesTile" data-series="tertiary">Enrolment in tertiary education</button></div><div class="hint"></div></div>
<div class="tabs"><button id="tabOverview" class="active">Overview</button><button id="tabDetail">Trend</button></div></aside>
<main class="main"><div class="title">Educational Enrollment Analysis Across Selected Countries (2016–2019)</div>
<section id="overview" class="page active"><div class="overview-grid"><div class="panel"><h3 id="mapTitle"></h3><div id="map" class="mapwrap"></div></div><div class="panel"><h3 id="barTitle"></h3><div class="barwrap"><canvas id="bar"></canvas></div></div><div class="bottom"><div><h3 id="cardTitle"></h3><div id="kpi" class="kpi">—</div></div><div id="insights" class="insights"></div></div></div></section>
<section id="detail" class="page"><div class="trend-grid"><div class="panel"><h3 id="lineTitle"></h3><div class="chartbox"><canvas id="line"></canvas></div></div><div class="panel"><h3 id="pieTitle"></h3><div class="chartbox"><canvas id="pie"></canvas></div></div></div><div id="insights2" class="insights2"></div></section></main></div>
<script>
const years=[2016,2017,2018,2019],names=['China','Georgia','India','Jordan','Oman','Qatar'];
const rows=[['Jordan','primary',[1049674,1106611,1133982,1147202]],['Jordan','secondary',[795433,763694,789822,832784]],['Jordan','tertiary',[315596,283904,320896,306799]],['Qatar','primary',[139194,146418,153908,159109]],['Qatar','secondary',[98149,103042,107537,117369]],['Qatar','tertiary',[28480,31277,33668,34941]],['Oman','primary',[368141,384001,278745,290045]],['Oman','secondary',[294485,295770,422440,436578]],['Oman','tertiary',[131678,121289,119722,119184]],['China','primary',[98189335,100321027,101872977,104325244]],['China','secondary',[83956318,83407925,84321859,86101697]],['China','tertiary',[43886104,44127509,44935169,46993614]],['India','primary',[145802543,143227427,136364711,120064163]],['India','secondary',[132161359,129829194,131759759,130932819]],['India','tertiary',[32391800,33374107,34337594,35148118]],['Georgia','primary',[291447,301094,305368,316542]],['Georgia','secondary',[274579,275464,280425,282929]],['Georgia','tertiary',[136709,144337,147785,151226]]];
const colors={primary:'#43a5ff',secondary:'#1676c5',tertiary:'#142b8c'},labels={primary:'Enrolment in primary education, both sexes (number)',secondary:'Enrolment in secondary education, both sexes (number)',tertiary:'Enrolment in tertiary education, all programmes, both sexes (number)'};
const pos={China:[96,35],Georgia:[24,24],India:[67,64],Jordan:[33,45],Oman:[39,59],Qatar:[36,52]};let selectedSeries=new Set(['primary','secondary','tertiary']),crossCountry=null,crossSeries=null,bar,line,pie;
const q=id=>document.getElementById(id),fmt=v=>v>=1e9?(v/1e9).toFixed(v>=1e10?1:2).replace(/\.0$/,'')+'bn':v>=1e6?(v/1e6).toFixed(v>=1e8?0:2).replace(/\.0$/,'')+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v.toLocaleString(),fmtCard=v=>v>=1e9?Math.round(v/1e9)+'bn':v>=1e6?Math.round(v/1e6)+'M':fmt(v);
function idx(a,b){a=+a;b=+b;if(a>b)[a,b]=[b,a];return years.map((y,i)=>y>=a&&y<=b?i:-1).filter(i=>i>=0)}
function seriesLabel(){return selectedSeries.size===3?'All Indicators':selectedSeries.size===1?labels[[...selectedSeries][0]]:'Multiple Indicators'}
function pieSeriesLabel(){return selectedSeries.size===1?labels[[...selectedSeries][0]]:'Multiple Indicators'}
function countryLabel(cs){return cs.length===names.length?'All Countries':cs.length===1?cs[0]:'Multiple Countries'}
function visualCountryLabel(cs){return cs.length===1?cs[0]:'Multiple Countries'}
function syncSeriesUI(){const a=q('seriesSelect');if(selectedSeries.size===3)a.value='all';else if(selectedSeries.size===1)a.value=[...selectedSeries][0];else a.value='multiple';document.querySelectorAll('.seriesTile').forEach(b=>b.classList.toggle('active',selectedSeries.has(b.dataset.series)));q('allSeries').classList.toggle('active',selectedSeries.size===3)}
function init(){names.forEach(n=>q('countries').insertAdjacentHTML('beforeend',`<label><input type="checkbox" value="${n}" checked> ${n}</label>`));names.forEach(n=>q('focusRadios').insertAdjacentHTML('beforeend',`<label><input type="radio" name="focus" value="${n}" ${n==='Jordan'?'checked':''}> ${n}</label>`));[q('fromYear'),q('toYear'),q('fromYear2'),q('toYear2')].forEach(sel=>years.forEach(y=>sel.add(new Option(y,y))));q('fromYear').value=q('fromYear2').value=2016;q('toYear').value=q('toYear2').value=2019;bind();syncSeriesUI();renderOverview();renderDetail()}
function bind(){document.querySelectorAll('#overviewSide input,#overviewSide select').forEach(x=>x.addEventListener('change',()=>{if(x===q('seriesSelect')){selectedSeries=x.value==='all'?new Set(['primary','secondary','tertiary']):new Set([x.value]);crossSeries=null;syncSeriesUI();renderDetail()}crossCountry=null;renderOverview()}));document.querySelectorAll('#detailSide input,#detailSide select').forEach(x=>x.addEventListener('change',()=>{renderDetail()}));q('allSeries').onclick=()=>{selectedSeries=new Set(['primary','secondary','tertiary']);crossSeries=null;syncSeriesUI();renderOverview();renderDetail()};document.querySelectorAll('.seriesTile').forEach(b=>b.onclick=()=>{const s=b.dataset.series;if(selectedSeries.has(s)&&selectedSeries.size>1)selectedSeries.delete(s);else selectedSeries.add(s);crossSeries=null;syncSeriesUI();renderOverview();renderDetail()});q('tabOverview').onclick=()=>show('overview');q('tabDetail').onclick=()=>show('detail')}
function show(id){q('overview').classList.toggle('active',id==='overview');q('detail').classList.toggle('active',id==='detail');q('overviewSide').classList.toggle('active',id==='overview');q('detailSide').classList.toggle('active',id==='detail');q('tabOverview').classList.toggle('active',id==='overview');q('tabDetail').classList.toggle('active',id==='detail');setTimeout(()=>{if(id==='overview')bar.resize();else{line.resize();pie.resize()}},60)}
function overviewCountries(){return[...document.querySelectorAll('#countries input:checked')].map(x=>x.value)}
function totalsFor(cs,ids){const out=Object.fromEntries(cs.map(c=>[c,{primary:0,secondary:0,tertiary:0}]));rows.filter(r=>cs.includes(r[0])&&selectedSeries.has(r[1])).forEach(r=>out[r[0]][r[1]]=ids.reduce((a,i)=>a+r[2][i],0));return out}
function visualTotal(totals,cs){const active=crossCountry&&cs.includes(crossCountry)?[crossCountry]:cs;return active.reduce((sum,c)=>sum+Object.values(totals[c]).reduce((a,b)=>a+b,0),0)}
function renderOverview(){const cs=overviewCountries(),ids=idx(q('fromYear').value,q('toYear').value),totals=totalsFor(cs,ids),activeCs=crossCountry&&cs.includes(crossCountry)?[crossCountry]:cs,yr=`${years[ids[0]]}-${years[ids.at(-1)]}`;q('mapTitle').textContent=`Geographical Distribution of Student Enrollment Across ${visualCountryLabel(activeCs)} (${yr})`;q('barTitle').textContent=`Comparison of Student Enrollment by Indicator Across Countries - ${visualCountryLabel(activeCs)} (${yr})`;q('cardTitle').textContent=`Total Enrollment - ${countryLabel(activeCs)} | ${seriesLabel()} | ${yr.replace('-',' - ')}`;q('kpi').textContent=fmtCard(visualTotal(totals,cs));
const map=q('map');map.innerHTML='';const max=Math.max(1,...cs.map(c=>Object.values(totals[c]).reduce((a,b)=>a+b,0)));cs.forEach(c=>{const vals=['primary','secondary','tertiary'].filter(k=>selectedSeries.has(k)).map(k=>[k,totals[c][k]]),t=vals.reduce((a,x)=>a+x[1],0);if(!t)return;const d=document.createElement('button');const size=24+38*Math.sqrt(t/max);d.className='bubble'+(crossCountry&&crossCountry!==c?' dim':'')+(crossCountry===c?' sel':'');d.style.left=pos[c][0]+'%';d.style.top=pos[c][1]+'%';d.style.width=d.style.height=size+'px';let acc=0,parts=[];vals.forEach(([k,v])=>{const a=acc/t*100;acc+=v;const b=acc/t*100;parts.push(`${colors[k]} ${a}% ${b}%`)});d.style.background=vals.length===1?colors[vals[0][0]]:`conic-gradient(${parts.join(',')})`;d.title=`${c}: ${fmt(t)}`;d.onclick=()=>{crossCountry=crossCountry===c?null:c;renderOverview()};map.appendChild(d)});
const keys=['primary','secondary','tertiary'].filter(k=>selectedSeries.has(k));if(bar)bar.destroy();bar=new Chart(q('bar'),{type:'bar',data:{labels:cs,datasets:keys.map(k=>({label:labels[k],data:cs.map(c=>totals[c][k]),backgroundColor:cs.map(c=>crossCountry&&c!==crossCountry?colors[k]+'33':colors[k])}))},options:{responsive:true,maintainAspectRatio:false,onClick:(e,els)=>{if(!els.length){crossCountry=null}else{const c=cs[els[0].index];crossCountry=crossCountry===c?null:c}renderOverview()},plugins:{legend:{position:'top',labels:{boxWidth:9,font:{size:9}}}},scales:{y:{ticks:{callback:v=>fmt(v)},title:{display:true,text:'Number of Students'}},x:{title:{display:true,text:'Country Name'}}}}});
q('insights').innerHTML=`<b style="font-size:20px">Insights</b><br>1- Total enrollment reached 2bn.<br>2- India has the highest total enrollment.<br>3- Primary Education drives the overall volume.`}
function detailCountry(){return document.querySelector('input[name="focus"]:checked')?.value||'Jordan'}
function renderDetail(){const c=detailCountry(),ids=idx(q('fromYear2').value,q('toYear2').value),ys=ids.map(i=>years[i]),yr=`${ys[0]}-${ys.at(-1)}`,baseKeys=['primary','secondary','tertiary'].filter(k=>selectedSeries.has(k)),keys=crossSeries&&baseKeys.includes(crossSeries)?[crossSeries]:baseKeys,d={};['primary','secondary','tertiary'].forEach(k=>{const r=rows.find(x=>x[0]===c&&x[1]===k);d[k]=ids.map(i=>r?r[2][i]:0)});q('lineTitle').textContent=`Enrollment Trends in ${c} (${yr}) by Education Level`;q('pieTitle').textContent=`Proportional Share - ${c} | ${crossSeries?labels[crossSeries]:pieSeriesLabel()} | ${yr.replace('-',' - ')}`;
if(line)line.destroy();line=new Chart(q('line'),{type:'line',data:{labels:ys,datasets:baseKeys.map(k=>({label:labels[k],data:d[k],borderColor:colors[k],backgroundColor:colors[k],tension:.15,pointRadius:4,borderWidth:crossSeries&&crossSeries!==k?1:3,hidden:false}))},options:{responsive:true,maintainAspectRatio:false,onClick:(e,els)=>{if(els.length){const k=baseKeys[els[0].datasetIndex];crossSeries=crossSeries===k?null:k;renderDetail()}},plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:9},filter:item=>!crossSeries||item.text===labels[crossSeries]}}},scales:{y:{ticks:{callback:v=>fmt(v)},title:{display:true,text:'Number of Students'}},x:{title:{display:true,text:'Years'}}}}});
const sums=baseKeys.map(k=>d[k].reduce((a,b)=>a+b,0));if(pie)pie.destroy();pie=new Chart(q('pie'),{type:'pie',data:{labels:baseKeys.map(k=>labels[k]),datasets:[{data:sums,backgroundColor:baseKeys.map(k=>crossSeries&&crossSeries!==k?colors[k]+'33':colors[k])}]},options:{responsive:true,maintainAspectRatio:false,onClick:(e,els)=>{if(els.length){const k=baseKeys[els[0].index];crossSeries=crossSeries===k?null:k;renderDetail()}},plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:9}}}}}});
q('insights2').innerHTML=`<b style="font-size:20px">Insights</b><br>1- Tertiary enrollment is growing across the selected countries, while primary enrollment shows a sharp decline in India and Oman and steady growth in China and Jordan.<br>2- Tertiary Share is highest in Georgia and China (around 20%), and lowest in India and Qatar (around 11%).`}
window.addEventListener('load',init)
</script></body></html>
