<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Educational Enrollment Dashboard</title>
<style>
html,body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#111}
.viewer{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px;gap:10px}
.frame{width:100%;max-width:1168px;background:white;border:1px solid #c8c8c8;box-shadow:0 12px 28px rgba(0,0,0,.16);overflow:hidden}
.frame img{display:block;width:100%;height:auto}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{border:1px solid #aaa;background:#fff;padding:9px 14px;font-weight:700;cursor:pointer;border-radius:6px}
.controls button.active{background:#333;color:white;border-color:#333}
.note{font-size:12px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="viewer">
  <div class="frame"><img id="dashImage" src="dashboard-overview.png" alt="Original Power BI dashboard overview"></div>
  <div class="controls">
    <button id="overviewBtn" class="active" onclick="showPage('overview')">Global Overview & Geography</button>
    <button id="detailBtn" onclick="showPage('detail')">Trend & Distribution Analysis</button>
  </div>
  <div class="note">Original dashboard screenshots from the Power BI project.</div>
</div>
<script>
function showPage(page){
 const img=document.getElementById('dashImage');
 const a=document.getElementById('overviewBtn');
 const b=document.getElementById('detailBtn');
 if(page==='detail'){img.src='dashboard-detailed-analysis.png';a.classList.remove('active');b.classList.add('active');}
 else{img.src='dashboard-overview.png';b.classList.remove('active');a.classList.add('active');}
}
</script>
</body>
</html>
